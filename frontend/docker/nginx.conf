server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    gzip off;

    # The Vben demo account carries /workspace as its home path. Redirect only
    # an empty or legacy hash in the browser so a refresh retains its current view.
    sub_filter_once on;
    sub_filter '</head>' '<script>(()=>{const c="#/openresty/centers";const e=()=>{if(!location.hash||location.hash==="#/"||location.hash==="#/workspace")location.hash=c};const t=setInterval(e,100);e();setTimeout(()=>clearInterval(t),3000)})()</script></head>';

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # 兼容旧构建产物遗漏 /api 前缀的认证请求。GET 仍交给 SPA 渲染登录页，
    # 只有 POST 登录请求转发到控制面。
    location = /auth/login {
        error_page 418 = @legacy_auth_login;
        if ($request_method = POST) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }
    location @legacy_auth_login {
        rewrite ^ /api/auth/login break;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /auth/refresh {
        proxy_pass http://127.0.0.1:8081/api/auth/refresh;
    }
    location = /auth/logout {
        proxy_pass http://127.0.0.1:8081/api/auth/logout;
    }
    location = /auth/codes {
        proxy_pass http://127.0.0.1:8081/api/auth/codes;
    }
    location = /user/info {
        proxy_pass http://127.0.0.1:8081/api/user/info;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
