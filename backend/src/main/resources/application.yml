spring:
  application:
    name: openresty-plus-control-plane
  datasource:
    url: ${OPENRESTY_DB_URL:jdbc:mysql://192.168.100.6:3306/openresty-plus?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${OPENRESTY_DB_USERNAME:openresty-plus}
    password: ${OPENRESTY_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${OPENRESTY_REDIS_HOST:192.168.100.6}
      port: ${OPENRESTY_REDIS_PORT:6379}
      password: ${OPENRESTY_REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${OPENRESTY_KAFKA_BOOTSTRAP_SERVERS:192.168.100.6:9092}
    consumer:
      group-id: ${OPENRESTY_KAFKA_CONSUMER_GROUP:openresty-plus-control-plane}
      auto-offset-reset: latest
      enable-auto-commit: true
      properties:
        spring.json.trusted.packages: net.daoke.openrestyplus
    listener:
      missing-topics-fatal: false
openresty:
  logs:
    kafka-topic: ${OPENRESTY_KAFKA_TOPIC:dtl-602-openresty-plus}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OPENRESTY_OIDC_ISSUER:http://localhost:8081/realms/openresty-plus}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  swagger-ui:
    path: /swagger-ui.html
