name: openresty-plus

services:
  control-plane:
    network_mode: host
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      OPENRESTY_DB_URL: ${OPENRESTY_DB_URL}
      OPENRESTY_DB_USERNAME: ${OPENRESTY_DB_USERNAME}
      OPENRESTY_DB_PASSWORD: ${OPENRESTY_DB_PASSWORD}
      OPENRESTY_REDIS_HOST: ${OPENRESTY_REDIS_HOST}
      OPENRESTY_REDIS_PORT: ${OPENRESTY_REDIS_PORT}
      OPENRESTY_REDIS_PASSWORD: ${OPENRESTY_REDIS_PASSWORD}
      OPENRESTY_KAFKA_BOOTSTRAP_SERVERS: ${OPENRESTY_KAFKA_BOOTSTRAP_SERVERS:-192.168.100.6:9092}
      OPENRESTY_KAFKA_TOPIC: ${OPENRESTY_KAFKA_TOPIC:-dtl-602-openresty-plus}
      OPENRESTY_RENDER_ROOT: /var/lib/openresty-plus/rendered
    volumes:
      - ./runtime/native-config:/var/lib/openresty-plus/rendered

  frontend:
    network_mode: host
    build:
      context: ./frontend
    volumes:
      - ./frontend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - control-plane

  openresty-east-1:
    network_mode: host
    build:
      context: ./deploy/openresty
      dockerfile: Dockerfile.control-api
    hostname: openresty-east-1
    environment:
      RUNTIME_CONTROL_PLANE_URL: http://127.0.0.1:8080
      RUNTIME_CENTER_ID: c62981ca-9bb7-4ab4-b871-5c9943efe84d
      RUNTIME_POLL_INTERVAL_SECONDS: 5
      RUNTIME_HTTP_PORT: 18080
      CONTROL_API_BRIDGE_PORT: 18081
    volumes:
      - ./runtime/native-config:/etc/openresty/generated
      - ./runtime/openresty-east-1/log:/var/log/nginx
    depends_on:
      - control-plane

  filebeat-east-1:
    network_mode: host
    build:
      context: ./deploy/filebeat
    environment:
      FILEBEAT_NODE_ID: ${FILEBEAT_EAST_1_NODE_ID:-}
      FILEBEAT_NODE_NAME: openresty-east-1
      FILEBEAT_KAFKA_HOSTS: ${OPENRESTY_KAFKA_BOOTSTRAP_SERVERS:-192.168.100.6:9092}
      FILEBEAT_KAFKA_TOPIC: ${OPENRESTY_KAFKA_TOPIC:-dtl-602-openresty-plus}
    volumes:
      - ./runtime/openresty-east-1/log:/var/log/nginx:ro
    depends_on:
      - openresty-east-1

  node-registration:
    build:
      context: ./deploy
    network_mode: host
    environment:
      CONTROL_PLANE_URL: http://127.0.0.1:8080
      CENTER_ID: c62981ca-9bb7-4ab4-b871-5c9943efe84d
    entrypoint: ["/opt/openresty-plus/scripts/register-compose-nodes.sh"]
    depends_on:
      - control-plane

  deploy-tools:
    network_mode: host
    build:
      context: ./deploy
    profiles: ["tools"]
    entrypoint: ["/bin/bash", "-lc"]
    command: ["sleep infinity"]
