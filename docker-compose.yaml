name: openresty-plus

services:
  mysql:
    container_name: openresty-plus-mysql
    image: mysql:8.4
    network_mode: host
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openresty-plus}
      MYSQL_USER: ${MYSQL_USER:-openresty-plus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-openresty-plus-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openresty-plus-root}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    container_name: openresty-plus-redis
    image: redis:7.4-alpine
    network_mode: host
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    container_name: openresty-plus-kafka
    image: apache/kafka:3.9.1
    network_mode: host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  control-plane:
    container_name: openresty-plus-control-plane
    network_mode: host
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      OPENRESTY_HTTP_ADDR: :8081
      OPENRESTY_DB_URL: jdbc:mysql://127.0.0.1:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-openresty-plus}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      OPENRESTY_DB_USERNAME: ${MYSQL_USER:-openresty-plus}
      OPENRESTY_DB_PASSWORD: ${MYSQL_PASSWORD:-openresty-plus-local}
      OPENRESTY_REDIS_HOST: 127.0.0.1
      OPENRESTY_REDIS_PORT: 6379
      OPENRESTY_REDIS_PASSWORD: ""
      OPENRESTY_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      OPENRESTY_KAFKA_TOPIC: ${OPENRESTY_KAFKA_TOPIC:-dtl-602-openresty-plus}
      OPENRESTY_RENDER_ROOT: /var/lib/openresty-plus/rendered
    volumes:
      - ./runtime/native-config:/var/lib/openresty-plus/rendered
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  frontend:
    container_name: openresty-plus-frontend
    network_mode: host
    build:
      context: ./frontend
    volumes:
      - ./frontend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - control-plane

  openresty-east-1:
    container_name: openresty-plus-openresty-east-1
    network_mode: host
    build:
      context: ./deploy/openresty
      dockerfile: Dockerfile.control-api
    hostname: openresty-east-1
    environment:
      RUNTIME_CONTROL_PLANE_URL: http://127.0.0.1:8081
      RUNTIME_CENTER_ID: c62981ca-9bb7-4ab4-b871-5c9943efe84d
      RUNTIME_POLL_INTERVAL_SECONDS: 5
      RUNTIME_HTTP_PORT: 18080
      CONTROL_API_BRIDGE_PORT: 18081
      NODE_REGISTRATION_ENABLED: "true"
      NODE_NAME: openresty-east-1
      NODE_HOST: 127.0.0.1
      NODE_SERVICE_PORT: 18080
      NODE_CONTROL_API_URL: http://127.0.0.1:18081
    volumes:
      - ./runtime/native-config:/etc/openresty/generated
      - ./runtime/openresty-east-1/log:/var/log/nginx
    depends_on:
      - control-plane

  filebeat-east-1:
    container_name: openresty-plus-filebeat-east-1
    network_mode: host
    build:
      context: ./deploy/filebeat
    environment:
      FILEBEAT_NODE_ID: ${FILEBEAT_EAST_1_NODE_ID:-}
      FILEBEAT_NODE_NAME: openresty-east-1
      FILEBEAT_KAFKA_HOSTS: 127.0.0.1:9092
      FILEBEAT_KAFKA_TOPIC: ${OPENRESTY_KAFKA_TOPIC:-dtl-602-openresty-plus}
    volumes:
      - ./runtime/openresty-east-1/log:/var/log/nginx:ro
    depends_on:
      - openresty-east-1

  deploy-tools:
    container_name: openresty-plus-deploy-tools
    network_mode: host
    build:
      context: ./deploy
    profiles: ["tools"]
    entrypoint: ["/bin/bash", "-lc"]
    command: ["sleep infinity"]

volumes:
  mysql-data:
  redis-data:
  kafka-data:
